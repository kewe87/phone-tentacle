<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 470" width="990" height="470" role="img" aria-label="What the BOOT button does (short press, double press, hold 10 s) and what the LED patterns mean">
  <!-- BOOT button and status LED, as hardware/hid_bridge/button.cpp drives them. Each LED strip shows 2 seconds. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d1724"/><stop offset="1" stop-color="#0d0a12"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a1c31"/><stop offset="1" stop-color="#130d19"/></linearGradient>
    <linearGradient id="arm" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#ffb03a"/><stop offset=".5" stop-color="#ff6a4d"/><stop offset="1" stop-color="#ff3d8b"/></linearGradient>
    <!-- 100 px = 1 s -->
    <pattern id="fast" patternUnits="userSpaceOnUse" x="520" width="25" height="18"><rect x="12.5" width="12.5" height="18" fill="#ffb03a"/></pattern>
    <pattern id="flicker" patternUnits="userSpaceOnUse" x="520" width="10" height="18"><rect x="5" width="5" height="18" fill="#ffb03a"/></pattern>
    <pattern id="pairing" patternUnits="userSpaceOnUse" x="520" width="100" height="18"><rect width="8" height="18" fill="#ffb03a"/><rect x="20" width="8" height="18" fill="#ffb03a"/></pattern>
    <clipPath id="strip"><rect x="520" y="0" width="200" height="470" rx="0"/></clipPath>
  </defs>
  <rect x="1" y="1" width="988" height="468" rx="28" fill="url(#tile)" stroke="#30263a" stroke-width="2"/>
  <rect x="30" y="92" width="440" height="318" rx="22" fill="url(#card)" stroke="#30263a" stroke-width="2"/>
  <rect x="500" y="92" width="460" height="318" rx="22" fill="url(#card)" stroke="#30263a" stroke-width="2"/>

  <!-- the three presses -->
  <g fill="url(#arm)">
    <circle cx="74" cy="150" r="11"/>
    <circle cx="62" cy="252" r="11"/><circle cx="90" cy="252" r="11"/>
    <rect x="51" y="341" width="50" height="22" rx="11"/>
  </g>

  <!-- LED strips: dark = off, amber = on -->
  <g fill="#0d0a12" stroke="#30263a" stroke-width="2">
    <rect x="519" y="125" width="202" height="20" rx="4"/>
    <rect x="519" y="183" width="202" height="20" rx="4"/>
    <rect x="519" y="241" width="202" height="20" rx="4"/>
    <rect x="519" y="299" width="202" height="20" rx="4"/>
    <rect x="519" y="357" width="202" height="20" rx="4"/>
  </g>
  <g clip-path="url(#strip)">
    <rect x="620" y="126" width="100" height="18" fill="#ffb03a"/>
    <rect x="520" y="184" width="200" height="18" fill="#ffb03a"/>
    <rect x="520" y="242" width="200" height="18" fill="url(#pairing)"/>
    <rect x="520" y="300" width="200" height="18" fill="url(#fast)"/>
    <rect x="520" y="358" width="200" height="18" fill="url(#flicker)"/>
  </g>

  <g font-family="Segoe UI, Inter, Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="30" y="62" font-size="24" font-weight="800" letter-spacing="-.3" fill="#f6f1f4">BOOT button and LED</text>
    <text x="960" y="62" font-size="13" fill="#a59bab" text-anchor="end">each LED strip shows 2 seconds</text>

    <g font-size="17" font-weight="800" fill="#f6f1f4">
      <text x="124" y="140">Short press</text>
      <text x="124" y="242">Double press</text>
      <text x="124" y="344">Hold 10 s</text>
    </g>
    <g font-size="13" fill="#a59bab">
      <text x="124" y="162">Stop: no mouse or keyboard output.</text>
      <text x="124" y="180">Press again to resume.</text>
      <text x="124" y="198" fill="#ff8a5c" font-weight="600">While a request waits: confirms it instead.</text>
      <text x="124" y="264">Two presses within half a second:</text>
      <text x="124" y="282">pairing is open for 60 s.</text>
      <text x="124" y="300">The stop state stays as it was.</text>
      <text x="124" y="366">Forgets the Wi-Fi. The setup hotspot</text>
      <text x="124" y="384">Tentacle-XXXX comes back.</text>
    </g>

    <g font-size="14" font-weight="800" fill="#f6f1f4">
      <text x="738" y="133">Slow blink</text>
      <text x="738" y="191">On</text>
      <text x="738" y="249">Two flashes a second</text>
      <text x="738" y="307">Fast blink</text>
      <text x="738" y="365">Flicker</text>
    </g>
    <g font-size="13" fill="#a59bab">
      <text x="738" y="151">running, input allowed</text>
      <text x="738" y="209">stopped: no input is sent</text>
      <text x="738" y="267">pairing is open (60 s)</text>
      <text x="738" y="325">press BOOT to confirm (30 s)</text>
      <text x="738" y="383">BOOT held; Wi-Fi forgotten at 10 s</text>
    </g>
    <text x="495" y="442" font-size="13" fill="#a59bab" text-anchor="middle">Fast blink: the setup page or a pairing code waits for the button. The manual lists every case.</text>
  </g>
</svg>
