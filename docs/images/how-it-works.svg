<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 380" width="990" height="380" role="img" aria-label="Computer, Tentacle board and iPhone: input goes from the computer over Wi-Fi to the board and over USB to the iPhone; the picture comes back over AirPlay and Wi-Fi">
  <!-- How Tentacle is wired up. Text is kept as text (Segoe UI with fallbacks), as in the brand files. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d1724"/><stop offset="1" stop-color="#0d0a12"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a1c31"/><stop offset="1" stop-color="#130d19"/></linearGradient>
    <linearGradient id="arm" gradientUnits="userSpaceOnUse" x1="220" y1="0" x2="770" y2="0"><stop offset="0" stop-color="#ffb03a"/><stop offset=".5" stop-color="#ff6a4d"/><stop offset="1" stop-color="#ff3d8b"/></linearGradient>
    <linearGradient id="edge" gradientUnits="userSpaceOnUse" x1="400" y1="290" x2="590" y2="110"><stop offset="0" stop-color="#ffb03a"/><stop offset=".5" stop-color="#ff6a4d"/><stop offset="1" stop-color="#ff3d8b"/></linearGradient>
    <linearGradient id="edge2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffb03a"/><stop offset=".5" stop-color="#ff6a4d"/><stop offset="1" stop-color="#ff3d8b"/></linearGradient>
  </defs>
  <rect x="1" y="1" width="988" height="378" rx="28" fill="url(#tile)" stroke="#30263a" stroke-width="2"/>

  <g font-family="Segoe UI, Inter, Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="30" y="62" font-size="24" font-weight="800" letter-spacing="-.3" fill="#f6f1f4">How it works</text>
    <!-- legend -->
    <rect x="740" y="53.5" width="40" height="5" rx="2.5" fill="url(#edge2)"/>
    <text x="786" y="60" font-size="13" fill="#a59bab">input</text>
    <line x1="846" y1="56" x2="882" y2="56" stroke="#f6f1f4" stroke-width="5" stroke-linecap="round" opacity=".85"/>
    <text x="890" y="60" font-size="13" fill="#a59bab">picture</text>

    <!-- the three parts -->
    <rect x="30" y="110" width="190" height="180" rx="22" fill="url(#card)" stroke="#30263a" stroke-width="2"/>
    <rect x="400" y="110" width="190" height="180" rx="22" fill="url(#card)" stroke="url(#edge)" stroke-width="3"/>
    <rect x="770" y="110" width="190" height="180" rx="22" fill="url(#card)" stroke="#30263a" stroke-width="2"/>

    <g text-anchor="middle">
      <text x="125" y="166" font-size="21" font-weight="800" fill="#f6f1f4">Computer</text>
      <text x="125" y="196" font-size="13" fill="#a59bab">tentacle command line</text>
      <text x="125" y="216" font-size="13" fill="#a59bab">MCP server</text>
      <text x="125" y="254" font-size="13" font-weight="600" fill="#ff8a5c">you or an AI assistant</text>

      <text x="495" y="166" font-size="21" font-weight="800" fill="#f6f1f4">Tentacle board</text>
      <text x="495" y="196" font-size="13" fill="#a59bab">ESP32-S3, thumbnail-sized</text>
      <text x="495" y="216" font-size="13" fill="#a59bab">BOOT button · LED · OLED</text>
      <text x="495" y="254" font-size="13" font-weight="600" fill="#ff8a5c">short press of BOOT = stop</text>

      <text x="865" y="166" font-size="21" font-weight="800" fill="#f6f1f4">iPhone</text>
      <text x="865" y="196" font-size="13" fill="#a59bab">no app, no jailbreak</text>
      <text x="865" y="216" font-size="13" fill="#a59bab">AssistiveTouch on</text>
      <text x="865" y="254" font-size="13" font-weight="600" fill="#ff8a5c">Screen Mirroring › Tentacle</text>

      <!-- computer and board: Wi-Fi -->
      <text x="310" y="158" font-size="13" font-weight="600" fill="#f6f1f4">tap, swipe, type</text>
      <text x="310" y="203" font-size="12" fill="#a59bab">Wi-Fi · TCP 7202</text>
      <text x="310" y="219" font-size="12" fill="#a59bab">encrypted</text>
      <text x="310" y="264" font-size="13" font-weight="600" fill="#f6f1f4">screenshots</text>

      <!-- board and iPhone: USB one way, AirPlay the other -->
      <text x="680" y="158" font-size="13" font-weight="600" fill="#f6f1f4">USB: mouse + keyboard</text>
      <text x="680" y="203" font-size="12" fill="#a59bab">USB-C cable ↑</text>
      <text x="680" y="219" font-size="12" fill="#a59bab">Wi-Fi ↓</text>
      <text x="680" y="264" font-size="13" font-weight="600" fill="#f6f1f4">AirPlay: screen</text>

      <text x="495" y="338" font-size="13" fill="#a59bab">Wi-Fi setup and pairing need a person at the board: both are confirmed with the BOOT button.</text>
    </g>
  </g>

  <!-- input: computer to board to iPhone -->
  <g stroke="url(#arm)" stroke-width="5" stroke-linecap="round" fill="none">
    <line x1="232" y1="172" x2="378" y2="172"/>
    <line x1="602" y1="172" x2="748" y2="172"/>
  </g>
  <path d="M376 162L392 172L376 182Z" fill="#ff6a4d"/>
  <path d="M746 162L762 172L746 182Z" fill="#ff3d8b"/>

  <!-- picture: iPhone to board to computer -->
  <g stroke="#f6f1f4" stroke-width="5" stroke-linecap="round" fill="none" opacity=".85">
    <line x1="758" y1="240" x2="612" y2="240"/>
    <line x1="388" y1="240" x2="242" y2="240"/>
  </g>
  <g fill="#f6f1f4" opacity=".85">
    <path d="M614 230L598 240L614 250Z"/>
    <path d="M244 230L228 240L244 250Z"/>
  </g>
</svg>
