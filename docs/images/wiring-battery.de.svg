<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" font-family="'Segoe UI',Inter,system-ui,sans-serif">
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d1724"/><stop offset="1" stop-color="#0d0a12"/></linearGradient><linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffb03a"/><stop offset=".5" stop-color="#ff6a4d"/><stop offset="1" stop-color="#ff3d8b"/></linearGradient><linearGradient id="pcb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b2136"/><stop offset="1" stop-color="#1a1422"/></linearGradient></defs>
<rect x="1" y="1" width="998" height="658" rx="28" fill="url(#bg)" stroke="#30263a" stroke-width="2"/>
<text x="40" y="52" font-size="24" font-weight="800" fill="#f6f1f4">Verdrahtung: Akku-Anzeige (optional)</text>
<text x="40" y="118" font-size="14" fill="#a59bab">XIAO ESP32S3 von oben, USB-C zeigt nach oben</text>
<line x1="40" y1="165" x2="66" y2="165" stroke="#ff3d8b" stroke-width="6" stroke-linecap="round"/>
<text x="78" y="170" font-size="13" fill="#f6f1f4">BAT+ → Akku +, und → 100 kΩ → D0</text>
<line x1="40" y1="195" x2="66" y2="195" stroke="#ffb03a" stroke-width="6" stroke-linecap="round"/>
<text x="78" y="200" font-size="13" fill="#f6f1f4">D0 → 100 kΩ → GND</text>
<line x1="40" y1="225" x2="66" y2="225" stroke="#d9d2de" stroke-width="6" stroke-linecap="round"/>
<text x="78" y="230" font-size="13" fill="#f6f1f4">BAT− → Akku −</text>
<g fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
<path d="M262 420 H322 V572 H460 V486" stroke="#ff3d8b"/>
<path d="M322 420 V345" stroke="#ff3d8b"/>
<path d="M322 295 V265 H352 V215 H384" stroke="#ffb03a"/>
<path d="M352 215 V84 H470" stroke="#ffb03a"/>
<path d="M530 84 H684 V257 H616" stroke="#d9d2de"/>
<path d="M262 480 H300 V594 H540 V486" stroke="#d9d2de"/>
</g>
<circle cx="322" cy="420" r="7" fill="#ff3d8b"/><circle cx="352" cy="215" r="7" fill="#ffb03a"/>
<rect x="308" y="295" width="28" height="50" rx="6" fill="#e9dcc3" stroke="#0d0a12" stroke-width="2"/>
<text x="298" y="325" font-size="13" font-weight="700" fill="#f6f1f4" text-anchor="end">100 kΩ</text>
<rect x="470" y="72" width="60" height="24" rx="6" fill="#e9dcc3" stroke="#0d0a12" stroke-width="2"/>
<text x="546" y="74" font-size="13" font-weight="700" fill="#f6f1f4">100 kΩ</text>
<rect x="60" y="390" width="200" height="120" rx="14" fill="#3a2e48" stroke="#52435f" stroke-width="2"/>
<text x="140" y="456" font-size="17" font-weight="800" fill="#f6f1f4" text-anchor="middle">LiPo 3,7 V</text>
<text x="240" y="426" font-size="18" font-weight="800" fill="#ff3d8b" text-anchor="middle">+</text>
<text x="240" y="486" font-size="18" font-weight="800" fill="#d9d2de" text-anchor="middle">−</text>
<rect x="462" y="118" width="76" height="62" rx="12" fill="#cfc6d6" stroke="#0d0a12" stroke-width="2"/>
<rect x="476" y="126" width="48" height="14" rx="7" fill="#2b2136"/>
<rect x="370" y="160" width="260" height="350" rx="22" fill="url(#pcb)" stroke="url(#brand)" stroke-width="3"/>
<rect x="452" y="250" width="96" height="120" rx="8" fill="#3a2e48" stroke="#52435f" stroke-width="2"/>
<text x="500" y="306" font-size="14" font-weight="700" fill="#f6f1f4" text-anchor="middle">ESP32-S3</text>
<text x="500" y="326" font-size="11" fill="#a59bab" text-anchor="middle">XIAO</text>
<g font-size="14" font-weight="700"><g fill="#8d7f99" stroke="#52435f" stroke-width="2">
<circle cx="384" cy="257" r="9"/>
<circle cx="384" cy="299" r="9"/>
<circle cx="384" cy="341" r="9"/>
<circle cx="384" cy="383" r="9"/>
<circle cx="384" cy="425" r="9"/>
<circle cx="384" cy="467" r="9"/>
<circle cx="616" cy="215" r="9"/>
<circle cx="616" cy="299" r="9"/>
<circle cx="616" cy="341" r="9"/>
<circle cx="616" cy="383" r="9"/>
<circle cx="616" cy="425" r="9"/>
<circle cx="616" cy="467" r="9"/>
</g>
<circle cx="384" cy="215" r="10" fill="#ffb03a" stroke="#0d0a12" stroke-width="2"/>
<circle cx="616" cy="257" r="10" fill="#d9d2de" stroke="#0d0a12" stroke-width="2"/>
<g fill="#8d7f99">
<text x="402" y="262">D1</text>
<text x="402" y="304">D2</text>
<text x="402" y="346">D3</text>
<text x="402" y="388">D4</text>
<text x="402" y="430">D5</text>
<text x="402" y="472">D6</text>
<text x="598" y="220" text-anchor="end">5V</text>
<text x="598" y="304" text-anchor="end">3V3</text>
<text x="598" y="346" text-anchor="end">D10</text>
<text x="598" y="388" text-anchor="end">D9</text>
<text x="598" y="430" text-anchor="end">D8</text>
<text x="598" y="472" text-anchor="end">D7</text>
</g><g fill="#f6f1f4"><text x="402" y="220">D0</text><text x="598" y="262" text-anchor="end">GND</text></g></g>
<circle cx="460" cy="476" r="10" fill="#ff3d8b" stroke="#f6f1f4" stroke-width="2" stroke-dasharray="4 3"/>
<circle cx="540" cy="476" r="10" fill="#d9d2de" stroke="#f6f1f4" stroke-width="2" stroke-dasharray="4 3"/>
<text x="460" y="452" font-size="12" font-weight="700" fill="#f6f1f4" text-anchor="middle">BAT+</text>
<text x="540" y="452" font-size="12" font-weight="700" fill="#f6f1f4" text-anchor="middle">BAT−</text>
<text x="500" y="428" font-size="11" fill="#a59bab" text-anchor="middle">Pads auf der Unterseite</text>
<text x="716" y="150" font-size="13" font-weight="700" fill="#a59bab" letter-spacing="1">SO WIRD GEMESSEN</text>
<text x="716" y="175" font-size="13.5" fill="#cfc6d6">Zwei gleiche Widerstände halbieren die</text>
<text x="716" y="195" font-size="13.5" fill="#cfc6d6">Akkuspannung: Aus 4,2 V werden 2,1 V</text>
<text x="716" y="215" font-size="13.5" fill="#cfc6d6">an D0, sicher unter den 3,3 V des Pins.</text>
<text x="716" y="253" font-size="13" font-weight="700" fill="#a59bab" letter-spacing="1">BAUEN</text>
<text x="716" y="278" font-size="13.5" font-family="Consolas,'Cascadia Mono',monospace" fill="#ff8a5c">--display --battery-pin 1</text>
<text x="716" y="298" font-size="13.5" fill="#cfc6d6">(D0 ist GPIO1; Anzeige auf dem OLED)</text>
<text x="716" y="336" font-size="13" font-weight="700" fill="#a59bab" letter-spacing="1">GUT ZU WISSEN</text>
<text x="716" y="361" font-size="13.5" fill="#cfc6d6">Die Prozentanzeige ist grob: 3,3 V = 0 %,</text>
<text x="716" y="381" font-size="13.5" fill="#cfc6d6">4,2 V = 100 %.</text>
<text x="716" y="401" font-size="13.5" fill="#cfc6d6">Der XIAO lädt den LiPo an den BAT-Pads,</text>
<text x="716" y="421" font-size="13.5" fill="#cfc6d6">solange USB-Strom anliegt.</text>
<text x="716" y="441" font-size="13.5" fill="#cfc6d6">Polung prüfen: BAT+ und BAT− sind auf</text>
<text x="716" y="461" font-size="13.5" fill="#cfc6d6">der Unterseite beschriftet.</text>
<text x="500" y="634" font-size="13" fill="#a59bab" text-anchor="middle">Zeichnung, nicht maßstäblich. Noch nicht auf Hardware getestet. Die Anzeige erscheint auf dem Status-OLED.</text>
</svg>
