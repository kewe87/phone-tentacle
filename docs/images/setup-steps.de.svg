<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 420" width="990" height="420" role="img" aria-label="Einrichtung in sechs Schritten: flashen, WLAN, Koppeln öffnen, koppeln, iPhone, los">
  <!-- Die Einrichtung auf einen Blick. Englische Fassung: setup-steps.svg. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d1724"/><stop offset="1" stop-color="#0d0a12"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a1c31"/><stop offset="1" stop-color="#130d19"/></linearGradient>
    <linearGradient id="arm" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#ffb03a"/><stop offset=".5" stop-color="#ff6a4d"/><stop offset="1" stop-color="#ff3d8b"/></linearGradient>
  </defs>
  <rect x="1" y="1" width="988" height="418" rx="28" fill="url(#tile)" stroke="#30263a" stroke-width="2"/>

  <g fill="url(#card)" stroke="#30263a" stroke-width="2">
    <rect x="30" y="92" width="290" height="124" rx="20"/>
    <rect x="350" y="92" width="290" height="124" rx="20"/>
    <rect x="670" y="92" width="290" height="124" rx="20"/>
    <rect x="30" y="236" width="290" height="124" rx="20"/>
    <rect x="350" y="236" width="290" height="124" rx="20"/>
    <rect x="670" y="236" width="290" height="124" rx="20"/>
  </g>
  <g fill="url(#arm)">
    <circle cx="64" cy="130" r="17"/><circle cx="384" cy="130" r="17"/><circle cx="704" cy="130" r="17"/>
    <circle cx="64" cy="274" r="17"/><circle cx="384" cy="274" r="17"/><circle cx="704" cy="274" r="17"/>
  </g>
  <!-- which way to read -->
  <g fill="none" stroke="#5d5366" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M330 147l8 7l-8 7"/><path d="M650 147l8 7l-8 7"/>
    <path d="M330 291l8 7l-8 7"/><path d="M650 291l8 7l-8 7"/>
  </g>

  <g font-family="Segoe UI, Inter, Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="30" y="62" font-size="24" font-weight="800" letter-spacing="-.3" fill="#f6f1f4">Einrichtung in sechs Schritten</text>

    <g font-size="16" font-weight="800" fill="#1a1420" text-anchor="middle">
      <text x="64" y="136">1</text><text x="384" y="136">2</text><text x="704" y="136">3</text>
      <text x="64" y="280">4</text><text x="384" y="280">5</text><text x="704" y="280">6</text>
    </g>
    <g font-size="18" font-weight="800" fill="#f6f1f4">
      <text x="92" y="136">Flashen</text>
      <text x="412" y="136">WLAN</text>
      <text x="732" y="136">Koppeln öffnen</text>
      <text x="92" y="280">Koppeln</text>
      <text x="412" y="280">iPhone</text>
      <text x="732" y="280">Los</text>
    </g>
    <g font-size="13" fill="#a59bab">
      <text x="54" y="194">Das Board öffnet das WLAN Tentacle-XXXX</text>
      <text x="374" y="172">Tentacle-XXXX beitreten, WLAN wählen,</text>
      <text x="374" y="194">dann binnen 30 s BOOT drücken</text>
      <text x="694" y="172">BOOT am Board doppelt drücken:</text>
      <text x="694" y="194">Koppeln ist 60 s offen</text>
      <text x="54" y="338">Code vergleichen, BOOT drücken (30 s)</text>
      <text x="374" y="316">Board anstecken, AssistiveTouch an,</text>
      <text x="374" y="338">Bildschirmsynchronisierung › Tentacle XXXX</text>
    </g>
    <text x="495" y="394" font-size="13" fill="#a59bab" text-anchor="middle">Ein Board merkt sich bis zu vier Computer. BOOT 10 s halten startet die WLAN-Einrichtung neu.</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="600" fill="#ff8a5c">
    <text x="54" y="172">hardware/flash.sh --display</text>
    <text x="54" y="316">tentacle pair</text>
    <text x="694" y="316">tentacle screenshot</text>
    <text x="694" y="338">tentacle io tap 240,520</text>
  </g>
</svg>
